<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>中转站价格工作台</title>
  <style>
    :root {
      --paper: #f4f1e9;
      --paper-strong: #fffdf8;
      --ink: #171916;
      --muted: #6b6e67;
      --line: #c9c6bb;
      --line-strong: #242721;
      --blue: #205b86;
      --blue-soft: #e1edf4;
      --green: #246a49;
      --green-soft: #dfeee3;
      --red: #a63e32;
      --red-soft: #f4dfda;
      --amber: #8a6419;
      --amber-soft: #f4e8c8;
      --gray-soft: #e9e8e2;
      --shadow: 0 16px 40px rgba(27, 29, 24, 0.08);
      --radius: 5px;
      --body-font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --display-font: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
      font-family: var(--body-font);
      color: var(--ink);
      background: var(--paper);
      font-synthesis: none;
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--paper); }
    body { margin: 0; min-height: 100vh; background: var(--paper); }
    button, input, textarea, select { font: inherit; }
    button, input, textarea, select { letter-spacing: 0; }
    button { color: inherit; }
    [hidden] { display: none !important; }

    .app-header {
      position: sticky;
      z-index: 30;
      top: 0;
      display: flex;
      min-height: 76px;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 13px clamp(16px, 3vw, 42px);
      border-bottom: 1px solid var(--line-strong);
      background: rgba(244, 241, 233, 0.96);
      backdrop-filter: blur(12px);
    }

    .brand { min-width: 190px; }
    .brand h1 {
      margin: 0;
      font-family: var(--display-font);
      font-size: clamp(20px, 2.2vw, 29px);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: 0;
    }
    .brand p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }

    .view-tabs {
      display: flex;
      align-self: stretch;
      align-items: stretch;
      gap: 4px;
    }
    .tab-button {
      position: relative;
      min-width: 112px;
      border: 0;
      background: transparent;
      padding: 0 14px;
      cursor: pointer;
      font-weight: 650;
    }
    .tab-button::after {
      position: absolute;
      right: 14px;
      bottom: 1px;
      left: 14px;
      height: 3px;
      background: var(--ink);
      content: "";
      opacity: 0;
      transform: scaleX(0.5);
      transition: 160ms ease;
    }
    .tab-button[aria-selected="true"]::after { opacity: 1; transform: scaleX(1); }

    .workspace {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr);
      min-height: calc(100vh - 76px);
    }
    .control-rail {
      position: sticky;
      top: 76px;
      align-self: start;
      min-height: calc(100vh - 76px);
      padding: 24px 20px;
      border-right: 1px solid var(--line);
      background: #ebe7dc;
    }
    .rail-title {
      margin: 0 0 18px;
      font-size: 11px;
      font-weight: 750;
      text-transform: uppercase;
      color: var(--muted);
    }
    .field { display: grid; gap: 7px; margin-bottom: 16px; }
    .field > label { color: var(--muted); font-size: 12px; font-weight: 650; }
    .input-unit { position: relative; }
    .input-unit input { padding-right: 44px; }
    .input-unit span {
      position: absolute;
      top: 50%;
      right: 11px;
      color: var(--muted);
      font-size: 11px;
      transform: translateY(-50%);
      pointer-events: none;
    }
    input, textarea, select {
      width: 100%;
      border: 1px solid #aaa79e;
      border-radius: 3px;
      outline: 0;
      background: var(--paper-strong);
      padding: 9px 10px;
      color: var(--ink);
      transition: border-color 120ms, box-shadow 120ms;
    }
    input:focus, textarea:focus, select:focus, button:focus-visible {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(32, 91, 134, 0.16);
      outline: none;
    }
    input[type="number"] { font-variant-numeric: tabular-nums; }
    .rail-divider { height: 1px; margin: 22px 0; background: var(--line); }
    .rail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .rail-actions .button:last-child { grid-column: 1 / -1; }

    .button {
      display: inline-flex;
      min-height: 36px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: transparent;
      padding: 7px 11px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: 120ms ease;
    }
    .button:hover { background: rgba(23, 25, 22, 0.07); }
    .button.primary { background: var(--ink); color: white; }
    .button.primary:hover { background: #30332d; }
    .button.danger { border-color: #b56b62; color: var(--red); }
    .button.compact { min-height: 32px; padding: 5px 9px; }

    .view-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .view-actions select { width: auto; min-width: 154px; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0 0 18px; color: var(--muted); font-size: 12px; }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .legend-swatch { width: 11px; height: 11px; border: 1px solid rgba(23, 25, 22, 0.22); }
    .legend-swatch.up { background: var(--red-soft); }
    .legend-swatch.down { background: var(--green-soft); }
    .legend-swatch.same { background: var(--gray-soft); }
    .legend-swatch.new { background: var(--amber-soft); }

    .editor-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.7fr) minmax(0, 1.3fr);
      gap: 14px 18px;
      margin-bottom: 22px;
    }
    .editor-grid .field { margin: 0; }
    .editor-grid .wide { grid-column: 1 / -1; }
    .editor-grid textarea { min-height: 72px; resize: vertical; line-height: 1.55; }

    .table-wrap {
      width: 100%;
      overflow: auto;
      border-top: 2px solid var(--line-strong);
      border-bottom: 1px solid var(--line-strong);
      background: var(--paper-strong);
    }
    .data-table { width: 100%; min-width: 780px; border-collapse: collapse; font-size: 13px; }
    .data-table th, .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    .data-table th {
      position: sticky;
      z-index: 2;
      top: 0;
      background: #ded9cd;
      color: #3d403a;
      font-size: 11px;
      font-weight: 750;
      text-transform: uppercase;
    }
    .data-table tr:last-child td { border-bottom: 0; }
    .data-table .number { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .data-table .category-cell { width: 155px; color: var(--muted); font-size: 12px; }
    .data-table .name-cell { min-width: 220px; font-weight: 650; }
    .data-table input { min-width: 108px; padding: 7px 8px; color: var(--blue); font-weight: 700; }
    .price-pair { display: grid; grid-template-columns: minmax(108px, 1fr) auto; align-items: center; gap: 10px; }
    .cny-value { min-width: 86px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
    .change-cell { min-width: 130px; font-weight: 700; }
    tr.change-up .change-cell { background: var(--red-soft); color: var(--red); }
    tr.change-down .change-cell { background: var(--green-soft); color: var(--green); }
    tr.change-same .change-cell { background: var(--gray-soft); color: var(--muted); }
    tr.change-new .change-cell { background: var(--amber-soft); color: var(--amber); }
    .section-caption { margin: 11px 0 0; color: var(--muted); font-size: 12px; }

    .view-container { min-width: 0; padding: 28px clamp(16px, 3.4vw, 52px) 60px; }
    .view-panel { animation: reveal 220ms ease both; }
    .view-panel > header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 2px solid var(--line-strong);
    }
    .view-panel h2 {
      margin: 0;
      font-family: var(--display-font);
      font-size: clamp(25px, 3vw, 38px);
      line-height: 1;
      letter-spacing: 0;
    }
    .view-panel header p { max-width: 580px; margin: 8px 0 0; color: var(--muted); font-size: 13px; }
    .placeholder {
      min-height: 320px;
      display: grid;
      place-items: center;
      border: 1px dashed var(--line);
      color: var(--muted);
      font-family: var(--display-font);
    }
    .status-toast {
      position: fixed;
      z-index: 80;
      right: 20px;
      bottom: 20px;
      max-width: min(380px, calc(100vw - 40px));
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--ink);
      padding: 11px 14px;
      color: white;
      box-shadow: var(--shadow);
      font-size: 13px;
    }
    @keyframes reveal { from { opacity: 0; transform: translateY(5px); } }

    @media (max-width: 900px) {
      .app-header { position: relative; display: grid; gap: 12px; }
      .view-tabs { overflow-x: auto; }
      .tab-button { min-height: 42px; min-width: 104px; }
      .workspace { display: block; }
      .control-rail {
        position: relative;
        top: 0;
        min-height: auto;
        display: grid;
        grid-template-columns: repeat(3, minmax(130px, 1fr));
        gap: 10px 14px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .rail-title, .rail-divider { display: none; }
      .field { margin: 0; }
      .rail-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; }
      .rail-actions .button:last-child { grid-column: auto; }
    }
    @media (max-width: 620px) {
      .control-rail { grid-template-columns: 1fr 1fr; padding: 16px; }
      .field:first-of-type { grid-column: 1 / -1; }
      .view-container { padding-top: 22px; }
      .view-panel > header { align-items: start; flex-direction: column; }
      .editor-grid { grid-template-columns: 1fr; }
      .editor-grid .wide { grid-column: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1>价格与盈利工作台</h1>
      <p>每日定价 · Stripe 净收款 · 额度利润</p>
    </div>
    <nav class="view-tabs" aria-label="工作区">
      <button class="tab-button" type="button" data-view-target="prices" aria-selected="true">每日价格</button>
      <button class="tab-button" type="button" data-view-target="stripe" aria-selected="false">Stripe 收款</button>
      <button class="tab-button" type="button" data-view-target="profit" aria-selected="false">盈利模板</button>
    </nav>
  </header>

  <main class="workspace" id="app">
    <aside class="control-rail" aria-label="全局参数">
      <p class="rail-title">全局计算口径</p>
      <div class="field">
        <label for="global-exchange-rate">人民币汇率</label>
        <div class="input-unit">
          <input id="global-exchange-rate" type="number" min="0.0001" step="0.01" inputmode="decimal">
          <span>CNY/$</span>
        </div>
      </div>
      <div class="field">
        <label for="global-stripe-rate">Stripe 比例费率</label>
        <div class="input-unit">
          <input id="global-stripe-rate" type="number" min="0" step="0.01" inputmode="decimal">
          <span>%</span>
        </div>
      </div>
      <div class="field">
        <label for="global-stripe-fixed">每笔固定手续费</label>
        <div class="input-unit">
          <input id="global-stripe-fixed" type="number" min="0" step="0.01" inputmode="decimal">
          <span>USD</span>
        </div>
      </div>
      <div class="rail-divider"></div>
      <div class="rail-actions">
        <button class="button compact" id="backup-export" type="button">导出备份</button>
        <button class="button compact" id="backup-import" type="button">导入备份</button>
        <button class="button compact danger" id="reset-state" type="button">恢复初始数据</button>
      </div>
      <input id="backup-file" type="file" accept="application/json,.json" hidden>
    </aside>

    <div class="view-container">
      <section class="view-panel" data-view="prices">
        <header>
          <div><h2>每日价格</h2><p>复制历史版本、调整各分组美元价格，并按上一日变化导出公告图。</p></div>
          <div class="view-actions">
            <select id="price-day-select" aria-label="选择价格日期"></select>
            <button class="button" id="duplicate-day" type="button">复制当天</button>
            <button class="button danger" id="delete-day" type="button">删除</button>
            <button class="button primary" id="export-price-image" type="button">导出图片</button>
          </div>
        </header>
        <div id="daily-price-root">
          <div class="legend" aria-label="价格变化图例">
            <span class="legend-item"><i class="legend-swatch up"></i>涨价</span>
            <span class="legend-item"><i class="legend-swatch down"></i>降价</span>
            <span class="legend-item"><i class="legend-swatch same"></i>持平</span>
            <span class="legend-item"><i class="legend-swatch new"></i>新增</span>
          </div>
          <div class="editor-grid" id="day-meta-editor"></div>
          <div class="table-wrap">
            <table class="data-table">
              <thead><tr><th>类型</th><th>分组</th><th>美元价格</th><th>人民币换算</th><th>较上一日</th></tr></thead>
              <tbody id="price-groups-body"></tbody>
            </table>
          </div>
          <p class="section-caption" id="comparison-caption"></p>
        </div>
      </section>
      <section class="view-panel" data-view="stripe" hidden>
        <header>
          <div><h2>Stripe 收款</h2><p>查看固定手续费对小额充值的损耗，以及各充值档位的实际到账。</p></div>
        </header>
        <div class="placeholder" id="stripe-root">Stripe 收款分析</div>
      </section>
      <section class="view-panel" data-view="profit" hidden>
        <header>
          <div><h2>盈利模板</h2><p>用多套成本与售价假设，对比不同充值档位下的真实利润空间。</p></div>
        </header>
        <div class="placeholder" id="profit-root">盈利模板分析</div>
      </section>
    </div>
  </main>
  <div class="status-toast" id="status-toast" role="status" aria-live="polite" hidden></div>

  <script id="calculator-core">
  (() => {
    "use strict";

    const STATE_VERSION = 1;

    function round(value, precision = 12) {
      if (!Number.isFinite(value)) return value;
      return Number(value.toFixed(precision));
    }

    function assertFinite(name, value, { min = -Infinity, exclusiveMin = false } = {}) {
      if (!Number.isFinite(value)) throw new TypeError(`${name} must be a finite number`);
      if (exclusiveMin ? value <= min : value < min) {
        const boundary = exclusiveMin && min === 0 ? "zero" : String(min);
        throw new RangeError(`${name} must be greater than ${boundary}`);
      }
    }

    function calculateStripe(amount, rate, fixedFee) {
      assertFinite("amount", amount, { min: 0, exclusiveMin: true });
      assertFinite("rate", rate, { min: 0 });
      assertFinite("fixed fee", fixedFee, { min: 0 });
      const fee = round(amount * rate + fixedFee);
      const net = round(Math.max(0, amount - fee));
      return {
        amount: round(amount),
        fee,
        net,
        lossRate: round(fee / amount),
        collectionRate: round(net / amount),
      };
    }

    function calculateProfitability(amount, options) {
      const { costPrice, salePrice, rate, fixedFee } = options;
      assertFinite("amount", amount, { min: 0, exclusiveMin: true });
      assertFinite("cost price", costPrice, { min: 0 });
      assertFinite("sale price", salePrice, { min: 0, exclusiveMin: true });
      const stripe = calculateStripe(amount, rate, fixedFee);
      const quotaPerDollar = 1 / salePrice;
      const costPerDollar = quotaPerDollar * costPrice;
      const totalCost = amount * costPerDollar;
      const surfaceMargin = 1 - costPerDollar;
      const actualProfit = stripe.net - totalCost;
      const actualMargin = stripe.net > 0 ? actualProfit / stripe.net : null;
      return {
        ...stripe,
        quotaPerDollar: round(quotaPerDollar),
        costPerDollar: round(costPerDollar),
        totalCost: round(totalCost),
        surfaceMargin: round(surfaceMargin),
        actualProfit: round(actualProfit),
        actualMargin: actualMargin === null ? null : round(actualMargin),
      };
    }

    function usdToCny(usd, exchangeRate) {
      assertFinite("USD amount", usd, { min: 0 });
      assertFinite("exchange rate", exchangeRate, { min: 0, exclusiveMin: true });
      return round(usd * exchangeRate);
    }

    function comparePrice(current, previous) {
      assertFinite("current price", current, { min: 0 });
      if (previous === null || previous === undefined || !Number.isFinite(previous)) {
        return { status: "new", delta: null, deltaRate: null };
      }
      assertFinite("previous price", previous, { min: 0 });
      const delta = round(current - previous);
      const status = delta > 0 ? "up" : delta < 0 ? "down" : "same";
      return {
        status,
        delta,
        deltaRate: previous === 0 ? null : round(delta / previous),
      };
    }

    function findPreviousDay(days, date) {
      return days
        .filter((day) => day.date < date)
        .sort((a, b) => b.date.localeCompare(a.date))[0] ?? null;
    }

    function buildPriceComparison(day, days) {
      const previousDay = findPreviousDay(days, day.date);
      const previousById = new Map((previousDay?.groups ?? []).map((item) => [item.id, item]));
      return {
        day,
        previousDay,
        rows: day.groups.map((item) => {
          const previous = previousById.get(item.id);
          return {
            group: item,
            previousPrice: previous?.price ?? null,
            comparison: comparePrice(item.price, previous?.price),
          };
        }),
      };
    }

    function cloneJson(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function addUtcDays(dateText, amount) {
      const date = new Date(`${dateText}T00:00:00Z`);
      date.setUTCDate(date.getUTCDate() + amount);
      return date.toISOString().slice(0, 10);
    }

    function clonePriceDay(source, existingDays) {
      const usedDates = new Set(existingDays.map((day) => day.date));
      let date = addUtcDays(source.date, 1);
      while (usedDates.has(date)) date = addUtcDays(date, 1);
      const copy = cloneJson(source);
      copy.date = date;
      copy.id = `day-${date}`;
      return copy;
    }

    function removePriceDay(state, id) {
      if (state.days.length <= 1) throw new RangeError("Keep at least one price day");
      const index = state.days.findIndex((day) => day.id === id);
      if (index < 0) return false;
      state.days.splice(index, 1);
      if (state.selectedDayId === id) state.selectedDayId = state.days.at(-1).id;
      return true;
    }

    function removeProfitTemplate(state, id) {
      if (state.templates.length <= 1) throw new RangeError("Keep at least one profit template");
      const index = state.templates.findIndex((template) => template.id === id);
      if (index < 0) return false;
      state.templates.splice(index, 1);
      if (state.selectedTemplateId === id) state.selectedTemplateId = state.templates.at(-1).id;
      return true;
    }

    function group(id, category, name, price, note = "") {
      return { id, category, name, price, note };
    }

    const baseImageGroups = [
      group("gpt-image-low", "生图分组", "gpt - image - low", 0.01, "仅支持 1/2K，中低画质"),
      group("gpt-image-medium", "生图分组", "gpt - image - medium", 0.02, "支持 1/2/4K，中画质"),
      group("gpt-image-high", "生图分组", "gpt - image - high", 0.045, "支持 1/2/4K，高画质"),
      group("grok-image", "生图分组", "grok - image", 0.002 / 6.8, "每张"),
    ];

    function createGroups(prices) {
      return [
        group("gpt-regression", "语言分组 · GPT", prices.regressionName ?? "gpt - regression（老客分组）", prices.regression),
        group("gpt-offer", "语言分组 · GPT", "gpt - offer", prices.offer),
        group("gpt-normal", "语言分组 · GPT", "gpt - normal", prices.normal),
        group("gpt-stable", "语言分组 · GPT", "gpt - stable", prices.stable),
        group("claude-offer", "语言分组 · Claude", "claude - offer（kiro高缓）", 0.012),
        group("grok-offer", "语言分组 · Grok", "grok - offer", 0.005),
        group("opensource-openai", "语言分组 · 开源国模", "opensource - openai", 0.3),
        group("opensource-claude", "语言分组 · 开源国模", "opensource - claude", 0.3),
        ...baseImageGroups.map((item) => ({ ...item })),
      ];
    }

    function priceDay(date, prices, market, note) {
      return {
        id: `day-${date}`,
        date,
        market,
        note,
        website: "https://mikiko.cc（带梯子访问）",
        downstream: "1. 开池模式\n2. 同账号重试次数 5-10\n3. 同账号重试状态码：400,401,403,429,502,503,524",
        groups: createGroups(prices),
      };
    }

    function createDefaultState() {
      const days = [
        priceDay(
          "2026-07-22",
          { regression: 0.004, offer: 0.008, normal: 0.016, stable: 0.023 },
          "号池全面拉闸，所有分组价格上调",
          "还没想好",
        ),
        priceDay(
          "2026-07-23",
          { regression: 0.011, offer: 0.015, normal: 0.018, stable: 0.023 },
          "号池白天难产，价格下不去；晚上顺产，价格会下调",
          "消除恐惧最好的办法就是面对恐惧，加油，奥利给！！！",
        ),
        priceDay(
          "2026-07-24",
          {
            regression: 0.012,
            regressionName: "gpt - regression（老客分组不稳定）",
            offer: 0.018,
            normal: 0.023,
            stable: 0.027,
          },
          "号池白天难产，价格下不去；晚上顺产，价格会下调",
          "消除恐惧最好的办法就是面对恐惧，加油，奥利给！！！",
        ),
        priceDay(
          "2026-07-25",
          {
            regression: 0.009,
            regressionName: "gpt - regression（老客分组不稳定）",
            offer: 0.016,
            normal: 0.018,
            stable: 0.024,
          },
          "号池白天难产，价格下不去；晚上顺产，价格会下调",
          "消除恐惧最好的办法就是面对恐惧，加油，奥利给！！！",
        ),
        priceDay(
          "2026-07-26",
          { regression: 0.009, offer: 0.013, normal: 0.018, stable: 0.024 },
          "号池白天难产，价格下不去；晚上顺产，价格会下调",
          "消除恐惧最好的办法就是面对恐惧，加油，奥利给！！！",
        ),
      ];

      return {
        version: STATE_VERSION,
        activeView: "prices",
        exchangeRate: 6.8,
        stripe: { rate: 0.029, fixedFee: 0.3, customAmount: 10 },
        selectedDayId: days.at(-1).id,
        selectedTemplateId: "template-default",
        days,
        templates: [{
          id: "template-default",
          name: "标准模型",
          costPrice: 0.01470588235,
          salePrice: 0.02,
        }],
      };
    }

    function validateState(state) {
      if (!state || typeof state !== "object") return false;
      if (state.version !== STATE_VERSION) return false;
      if (!Number.isFinite(state.exchangeRate) || state.exchangeRate <= 0) return false;
      if (!state.stripe || !Number.isFinite(state.stripe.rate) || state.stripe.rate < 0) return false;
      if (!Number.isFinite(state.stripe.fixedFee) || state.stripe.fixedFee < 0) return false;
      if (!Array.isArray(state.days) || state.days.length < 1) return false;
      if (!Array.isArray(state.templates) || state.templates.length < 1) return false;
      const daysValid = state.days.every((day) => /^\d{4}-\d{2}-\d{2}$/.test(day.date)
        && Array.isArray(day.groups)
        && day.groups.every((item) => typeof item.id === "string" && Number.isFinite(item.price) && item.price >= 0));
      const templatesValid = state.templates.every((template) => typeof template.id === "string"
        && typeof template.name === "string"
        && Number.isFinite(template.costPrice)
        && template.costPrice >= 0
        && Number.isFinite(template.salePrice)
        && template.salePrice > 0);
      return daysValid && templatesValid;
    }

    function normalizeImportedState(input) {
      const copy = cloneJson(input);
      if (!validateState(copy)) throw new TypeError("Invalid backup data");
      if (!copy.days.some((day) => day.id === copy.selectedDayId)) copy.selectedDayId = copy.days.at(-1).id;
      if (!copy.templates.some((template) => template.id === copy.selectedTemplateId)) {
        copy.selectedTemplateId = copy.templates[0].id;
      }
      if (!["prices", "stripe", "profit"].includes(copy.activeView)) copy.activeView = "prices";
      return copy;
    }

    window.PricingCalculatorCore = Object.freeze({
      STATE_VERSION,
      round,
      calculateStripe,
      calculateProfitability,
      usdToCny,
      comparePrice,
      findPreviousDay,
      buildPriceComparison,
      clonePriceDay,
      removePriceDay,
      removeProfitTemplate,
      validateState,
      normalizeImportedState,
      createDefaultState,
    });
  })();
  </script>
  <script>
  (() => {
    "use strict";
    const core = window.PricingCalculatorCore;
    const STORAGE_KEY = "relay-pricing-calculator-state-v1";
    let state = loadState();
    let toastTimer;

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? core.normalizeImportedState(JSON.parse(saved)) : core.createDefaultState();
      } catch {
        return core.createDefaultState();
      }
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function showStatus(message, tone = "default") {
      const toast = document.querySelector("#status-toast");
      toast.textContent = message;
      toast.style.background = tone === "error" ? "var(--red)" : "var(--ink)";
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.hidden = true; }, 3200);
    }

    function renderShell() {
      document.querySelector("#global-exchange-rate").value = state.exchangeRate;
      document.querySelector("#global-stripe-rate").value = core.round(state.stripe.rate * 100, 4);
      document.querySelector("#global-stripe-fixed").value = state.stripe.fixedFee;
      document.querySelectorAll("[data-view-target]").forEach((button) => {
        button.setAttribute("aria-selected", String(button.dataset.viewTarget === state.activeView));
      });
      document.querySelectorAll("[data-view]").forEach((panel) => {
        panel.hidden = panel.dataset.view !== state.activeView;
      });
      renderDailyPrices();
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (character) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;",
      })[character]);
    }

    function formatUsd(value, precision = 6) {
      return `$${core.round(value, precision).toFixed(precision).replace(/0+$/, "").replace(/\.$/, "")}`;
    }

    function renderDailyPrices() {
      const sortedDays = [...state.days].sort((a, b) => b.date.localeCompare(a.date));
      let day = state.days.find((item) => item.id === state.selectedDayId);
      if (!day) {
        day = sortedDays[0];
        state.selectedDayId = day.id;
      }
      const model = core.buildPriceComparison(day, state.days);
      document.querySelector("#price-day-select").innerHTML = sortedDays.map((item) => (
        `<option value="${escapeHtml(item.id)}" ${item.id === day.id ? "selected" : ""}>${escapeHtml(item.date)}</option>`
      )).join("");
      document.querySelector("#day-meta-editor").innerHTML = `
        <div class="field"><label for="day-date">发布日期</label><input id="day-date" data-day-field="date" type="date" value="${escapeHtml(day.date)}"></div>
        <div class="field"><label for="day-website">官网地址</label><input id="day-website" data-day-field="website" value="${escapeHtml(day.website)}"></div>
        <div class="field wide"><label for="day-market">今日行情</label><textarea id="day-market" data-day-field="market">${escapeHtml(day.market)}</textarea></div>
        <div class="field wide"><label for="day-note">每日备注</label><textarea id="day-note" data-day-field="note">${escapeHtml(day.note)}</textarea></div>
        <div class="field wide"><label for="day-downstream">下游配置说明</label><textarea id="day-downstream" data-day-field="downstream">${escapeHtml(day.downstream)}</textarea></div>
      `;
      document.querySelector("#price-groups-body").innerHTML = model.rows.map(({ group: item, comparison }) => {
        const labels = {
          up: `↑ 涨 ${formatUsd(Math.abs(comparison.delta))}`,
          down: `↓ 降 ${formatUsd(Math.abs(comparison.delta))}`,
          same: "— 持平",
          new: "+ 新增",
        };
        return `<tr class="change-${comparison.status}" data-group-row="${escapeHtml(item.id)}">
          <td class="category-cell">${escapeHtml(item.category)}</td>
          <td class="name-cell">${escapeHtml(item.name)}${item.note ? `<small style="display:block;margin-top:4px;color:var(--muted);font-weight:400">${escapeHtml(item.note)}</small>` : ""}</td>
          <td><input type="number" min="0" step="0.0001" inputmode="decimal" data-group-id="${escapeHtml(item.id)}" value="${item.price}"></td>
          <td class="number cny-value">¥${core.usdToCny(item.price, state.exchangeRate).toFixed(4)}</td>
          <td class="change-cell">${labels[comparison.status]}</td>
        </tr>`;
      }).join("");
      document.querySelector("#comparison-caption").textContent = model.previousDay
        ? `当前价格与 ${model.previousDay.date} 对比；所有输入以美元为准，人民币按 ${state.exchangeRate} 汇率换算。`
        : `这是最早一条价格记录；所有分组标记为新增。人民币按 ${state.exchangeRate} 汇率换算。`;
    }

    function updateGlobalNumber(path, rawValue) {
      const value = Number(rawValue);
      if (!Number.isFinite(value) || value < 0 || (path === "exchangeRate" && value === 0)) {
        renderShell();
        showStatus("请输入有效的非负数值", "error");
        return;
      }
      if (path === "exchangeRate") state.exchangeRate = value;
      if (path === "stripeRate") state.stripe.rate = value / 100;
      if (path === "stripeFixed") state.stripe.fixedFee = value;
      persist();
      window.dispatchEvent(new CustomEvent("pricing-state-change"));
    }

    function download(name, blob) {
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = name;
      document.body.append(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
    }

    document.addEventListener("click", (event) => {
      const tab = event.target.closest("[data-view-target]");
      if (tab) {
        state.activeView = tab.dataset.viewTarget;
        persist();
        renderShell();
        return;
      }
      if (event.target.closest("#backup-export")) {
        download("中转站价格工作台备份.json", new Blob([JSON.stringify(state, null, 2)], { type: "application/json" }));
        showStatus("备份已导出");
      }
      if (event.target.closest("#backup-import")) document.querySelector("#backup-file").click();
      if (event.target.closest("#duplicate-day")) {
        const source = state.days.find((day) => day.id === state.selectedDayId);
        const copy = core.clonePriceDay(source, state.days);
        state.days.push(copy);
        state.selectedDayId = copy.id;
        persist();
        renderShell();
        showStatus(`已创建 ${copy.date} 价格副本`);
      }
      if (event.target.closest("#delete-day")) {
        const selected = state.days.find((day) => day.id === state.selectedDayId);
        if (selected && window.confirm(`删除 ${selected.date} 的价格记录？`)) {
          try {
            core.removePriceDay(state, selected.id);
            persist();
            renderShell();
            showStatus("价格记录已删除");
          } catch {
            showStatus("至少需要保留一天价格", "error");
          }
        }
      }
      if (event.target.closest("#reset-state") && window.confirm("恢复 Excel 初始数据？当前本地修改将被覆盖。")) {
        state = core.createDefaultState();
        persist();
        renderShell();
        window.dispatchEvent(new CustomEvent("pricing-state-change"));
        showStatus("已恢复初始数据");
      }
    });

    document.addEventListener("change", (event) => {
      if (event.target.matches("#price-day-select")) {
        state.selectedDayId = event.target.value;
        persist();
        renderDailyPrices();
        return;
      }
      const day = state.days.find((item) => item.id === state.selectedDayId);
      if (!day) return;
      const field = event.target.dataset.dayField;
      if (field) {
        if (field === "date") {
          const nextDate = event.target.value;
          if (!/^\d{4}-\d{2}-\d{2}$/.test(nextDate) || state.days.some((item) => item !== day && item.date === nextDate)) {
            showStatus("日期无效或已存在", "error");
            renderDailyPrices();
            return;
          }
          day.date = nextDate;
          day.id = `day-${nextDate}`;
          state.selectedDayId = day.id;
        } else {
          day[field] = event.target.value;
        }
        persist();
        renderDailyPrices();
        return;
      }
      const groupId = event.target.dataset.groupId;
      if (groupId) {
        const value = Number(event.target.value);
        const priceGroup = day.groups.find((item) => item.id === groupId);
        if (!priceGroup || !Number.isFinite(value) || value < 0) {
          showStatus("请输入有效的美元价格", "error");
          renderDailyPrices();
          return;
        }
        priceGroup.price = value;
        persist();
        renderDailyPrices();
      }
    });

    document.querySelector("#global-exchange-rate").addEventListener("change", (event) => updateGlobalNumber("exchangeRate", event.target.value));
    document.querySelector("#global-stripe-rate").addEventListener("change", (event) => updateGlobalNumber("stripeRate", event.target.value));
    document.querySelector("#global-stripe-fixed").addEventListener("change", (event) => updateGlobalNumber("stripeFixed", event.target.value));
    document.querySelector("#backup-file").addEventListener("change", async (event) => {
      const [file] = event.target.files;
      if (!file) return;
      try {
        state = core.normalizeImportedState(JSON.parse(await file.text()));
        persist();
        renderShell();
        window.dispatchEvent(new CustomEvent("pricing-state-change"));
        showStatus("备份已导入");
      } catch {
        showStatus("备份无效，未修改现有数据", "error");
      } finally {
        event.target.value = "";
      }
    });

    window.PricingCalculatorApp = {
      getState: () => state,
      setState: (nextState) => { state = nextState; persist(); renderShell(); },
      persist,
      showStatus,
    };
    renderShell();
  })();
  </script>
</body>
